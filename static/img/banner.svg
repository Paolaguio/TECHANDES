      <stop offset="0%" stop-color="#071d36" />
      <stop offset="55%" stop-color="#0e3a66" />
      <stop offset="100%" stop-color="#1673b8" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36c2e0" />
      <stop offset="100%" stop-color="#1b78bd" />
    </linearGradient>
  </defs>
  <rect width="1100" height="220" fill="url(#bg)" />
  <!-- Cordillera estilizada -->
  <polygon points="0,220 0,165 140,120 290,175 460,115 640,170 830,110 980,160 1100,125 1100,220" fill="#06172b" opacity="0.55" />
  <polygon points="0,220 90,155 240,190 410,145 590,195 770,140 940,185 1100,150 1100,220" fill="#04101f" opacity="0.7" />
