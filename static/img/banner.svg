  <!-- Texto -->
  <text x="215" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="3">TECHANDES <tspan font-size="22" font-weight="600" fill="#93c5fd">S.A.S.</tspan></text>
  <text x="217" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#bae6fd" letter-spacing="1">Tecnología que llega a toda Colombia</text>
