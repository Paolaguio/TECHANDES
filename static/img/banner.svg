    <g stroke="#36c2e0" stroke-width="4" stroke-linecap="round">
      <line x1="36" y1="4" x2="36" y2="14" /><line x1="58" y1="4" x2="58" y2="14" /><line x1="80" y1="4" x2="80" y2="14" />
      <line x1="36" y1="102" x2="36" y2="112" /><line x1="58" y1="102" x2="58" y2="112" /><line x1="80" y1="102" x2="80" y2="112" />
      <line x1="4" y1="36" x2="14" y2="36" /><line x1="4" y1="58" x2="14" y2="58" /><line x1="4" y1="80" x2="14" y2="80" />
      <line x1="102" y1="36" x2="112" y2="36" /><line x1="102" y1="58" x2="112" y2="58" /><line x1="102" y1="80" x2="112" y2="80" />
